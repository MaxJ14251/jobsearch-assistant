# ---------------------------------------------------------------------------
# Education. State your credential EXACTLY and honestly.
#
# The example shows the harder case on purpose: coursework without a conferred
# degree. Roughly half of the postings this tool collects state a degree
# requirement, and nothing in this project will imply a degree you do not hold
# — `jsa prep` drills the question and the verifier refuses a draft that claims
# one. If you did finish, write it plainly instead:
#
#     credential: BS Computer Science
#
# Either way, state the FIELD: it is what "BS in X or equivalent experience"
# postings actually care about.
# ---------------------------------------------------------------------------
education:
  - id: edu_example
    institution: State University
    credential: Coursework completed (degree not conferred)
    field: Computer Science
    start: 2018
    end: 2020

skills:
  ai_tools:
    - Prompt Engineering
    - LLM Application Design
    - Evaluation Sets
  technical:
    - Python
    - Automation Pipelines
    - API Integration
    - SQLite
  applied_focus:
    - Data Analysis
    - Rapid Prototyping
    - Self-Directed Learning
  # TODO: these are conspicuously absent and most JDs will screen on them.
  # Add only what you can defend in an interview.
  unverified_candidates:
    - Git / GitHub
    - SQL
    - REST APIs
    - Docker
    - AWS / GCP / Azure (which one?)
    - FastAPI / Flask
    - pandas

# ---------------------------------------------------------------------------
# ATS keyword bank. The tailoring module scores a JD against `have` and reports
# `missing` so you see the real gap instead of keyword-stuffing.
# ---------------------------------------------------------------------------
ats_keywords:
  have:
    - Python
    - Large Language Models
    - LLM
    - Generative AI
    - Prompt Engineering
    - API Integration
    - Automation
    - Data Analysis
    - Rapid Prototyping
    - Technical Sales
    - Customer-Facing
  # Never insert these into a resume unless the underlying skill becomes true.
  # The verifier treats this list as a hard refusal, wherever the words came
  # from — including a job description that asks for them.
  aspirational_do_not_claim:
    - Kubernetes
    - Distributed Systems
    - Production ML
    - PyTorch
    - TensorFlow
    - Java
    - C++
    - React

# ---------------------------------------------------------------------------
# Honest positioning notes. Used by the tailoring and interview-prep modules;
# never printed on a resume. Write the things you would rather not say out
# loud: this is where the tool learns what NOT to claim.
# ---------------------------------------------------------------------------
gaps_and_notes:
  - id: gap_no_swe_employment
    note: >-
      No paid software engineering employment yet. Both technical projects are
      self-directed and in development. Discovery should target entry/junior/
      associate roles, apprenticeships, and technical customer-facing roles
      (solutions engineer, forward-deployed engineer, support engineer) where a
      field and sales background is an asset rather than a detour.
  - id: gap_employment_break
    note: >-
      Gap from late 2023 to present. Frame as a deliberate pivot: certificates
      in 2025 plus two applied projects. Have a one-sentence answer ready — the
      interview-prep module drills this one every time.
  - id: gap_no_shipped_repo
    note: >-
      Nothing public on the repo host yet is the single biggest fixable
      weakness. One finished, documented project would outweigh another
      certificate.
  - id: strength_sales
    note: >-
      Three years of revenue-facing work is genuinely differentiating against
      other career-changers. Lead with it for any role that touches a customer.
