        tags: [api-integration, orchestration, scheduling, architecture, automation]

  # Self-referential: the tool you are reading is a legitimate portfolio project
  # for whoever builds on it. Bullets stay empty until it actually does the
  # thing — do not claim it before it works.
  - id: proj_job_agent
    name: Agentic Job Search Assistant
    status: in_development
    repo: null
    demo: null
    stack: [Python, SQLite, FastAPI, LLM APIs]
    family: ai_engineering
    bullets: []                 # TODO — write these from what actually gets built

