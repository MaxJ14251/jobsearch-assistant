# ---------------------------------------------------------------------------
# Summary variants. The tailoring module picks the closest `family` match and
# then lightly rewords it against the JD — it does not write one from scratch.
# ---------------------------------------------------------------------------
summaries:
  - id: sum_general
    family: general
    text: >-
      Emerging AI practitioner with hands-on experience building real automation
      pipelines using Claude and Gemini, not just coursework. Comfortable across the
      full development cycle: prompt engineering, multi-API orchestration, and
      cloud-native integration. Brings an uncommon combination of technical AI skills
      and real-world sales experience, with a proven ability to learn complex systems
      quickly and apply them to practical problems.
  - id: sum_ai_eng
    family: ai_engineering
    text: >-
      Self-directed AI practitioner building production-shaped LLM pipelines in Python
      with Claude and Gemini — prompt design, multi-API orchestration, and cloud-native
      integration. Currently shipping two applied projects: an automated video
      highlight pipeline and a real-time streaming game data analysis tool.
  - id: sum_customer_facing
    family: customer_facing_technical
    text: >-
      Technical practitioner with a sales background: three years selling and installing
      fire alarm and security systems, now building LLM automation pipelines in Python
      with Claude and Gemini. Combines hands-on system knowledge with the customer-facing
      skills to explain it — a fit for solutions, forward-deployed, and technical
      account roles.

# ---------------------------------------------------------------------------
# Work experience. `bullets` are the reusable units.
#   strength: how load-bearing the bullet is (1 = always include, 3 = filler)
#   tags:     matched against JD keywords by the tailoring module
# ---------------------------------------------------------------------------
experience:
  - id: exp_riv_sales
    company: Riverton
    company_descriptor: Fire Alarm & Security Systems
    title: Sales Representative
    location: null              # TODO — needed for a complete resume header
    start: 2022-02
    end: 2023-11
    current: false
    family: sales
    # Optional. The bullet to show when this job appears only so the resume
    # has work history (e.g. a sales job on an engineering resume). Without it
    # the best keyword match is used. Must be one of this entry's bullets.
    work_history_bullet: b_riv_promo
    bullets:
      - id: b_riv_promo
        strength: 1
        text: >-
          Promoted from installer to sales based on technical expertise and
          customer-facing performance.
        tags: [promotion, growth, customer-facing, technical-credibility]
      - id: b_riv_sell
