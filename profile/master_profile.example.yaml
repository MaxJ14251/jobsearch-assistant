# EXAMPLE master profile. Copy to `master_profile.yaml` and replace with your
# own history, then keep that file out of version control — it holds your name,
# address, phone and email.
#
#     cp profile/master_profile.example.yaml profile/master_profile.yaml
#
# Master profile — the single source of truth for all resume/cover-letter tailoring.
# Every bullet is atomic and reusable. The tailoring module selects bullets by
# `tags` / `family` against a job description, it never invents new claims.
#
# RULE: nothing in this file may be fabricated. Fields marked TODO are unanswered
# and must stay empty until the candidate fills them in. A tailoring run must fail loudly
# rather than guess at a TODO.

schema_version: 1
last_updated: 2026-09-09
source_document: your_resume.pdf

identity:
  full_name: Your Full Name
  preferred_name: You
  pronouns: null
  location:
    street: 123 Example St
    city: Your City
    state: CA
    postal_code: "00000"
    country: USA
  email: you@example.com
  phone: "+1 (555) 555-5555"

links:
  linkedin: https://linkedin.com/in/your-handle
  github: https://github.com/your-handle
  portfolio: null
  website: null

# ---------------------------------------------------------------------------
# Search preferences — drives the job-discovery filters (build step 3).
# These are NOT on the resume; they are unanswered until you set them.
# ---------------------------------------------------------------------------
job_search_preferences:
  target_titles:
    - "AI Engineer"
    - "LLM Engineer"
    - "Applied AI Engineer"
    - "Prompt Engineer"
    - "Forward Deployed Engineer"
    - "Solutions Engineer"
    - "Solutions Architect"
    - "Technical Account Manager"
    - "Sales Engineer"
    - "Support Engineer"
    - "Technical Support Engineer"
    - "Implementation Specialist"
    - "Implementation Engineer"
    - "Onboarding Engineer"
    - "Python Developer"
    - "Software Engineer"
    - "Automation Engineer"
    - "Data Analyst"
  # Second tier: roles that lean on the candidate's proven sales experience rather than
  # the engineering pivot. In scope, but deliberately ranked below anything in
  # target_titles — a tier-2 match is multiplied by fallback_weight, so an
  # engineering role always outranks a sales role of equivalent quality.
  fallback_titles:
    - "Account Executive"
    - "Enterprise Account Executive"
    - "Mid-Market Account Executive"
    - "Account Manager"
    - "Customer Success Manager"
    - "Business Development Representative"
    - "Sales Development Representative"
  fallback_weight: 0.7

  seniority: ["intern", "entry", "junior", "associate", "mid"]
  work_arrangement: ["remote", "hybrid", "onsite"]
  locations:
    # Where you would actually work. "Remote (US)" keeps remote roles; the
    # rest are cities, written "City, ST". A job in a state you name here but
    # not in a city you name scores lower than one in your own city, and
    # higher than one somewhere you never listed.
    - "Remote (US)"
    - "Your City, ST"
    - "A Nearby City, ST"
    - "A City You Would Relocate To, ST"
  # --- compensation and authorization -------------------------------------
  # See docs/decisions/0001-compensation-and-work-authorization.md
  #
  # This field is a THRESHOLD, not a preference. It answers "below what number
  # would I not take the job", which is a different question from "do I prefer
  # more money" -- everyone prefers more money, so that is handled
  # automatically and is not a setting. Leaving no threshold here does NOT
  # mean pay is ignored when ranking.
  #
  # Three forms:
  #     no_floor          you have no threshold. Most people.
  #     95000             one figure, in USD
  #     a map keyed to the `regions` block below, for when the honest answer
  #     is two numbers (rent-free in one place, renting in another):
  #         compensation_floor_usd:
  #           default: 95000
  #           pa: 85000
  #           sd: 110000
  #
  # null means "not yet decided". Discovery tolerates it; document generation
  # refuses to run on it. Undecided and "no threshold" are different answers.
  #
  # A job whose TOP stated pay is below the floor scores 0, with the reason
  # shown. A job that states no pay is never rejected. Run `jsa rescore` after
  # changing this. See docs/decisions/0006-salary-extraction-and-pay-ranking.md.
  compensation_floor_usd: null   # no_floor | a number | a per-region map
  work_authorization: null       # e.g. "US citizen - no sponsorship required"
  needs_visa_sponsorship: null   # true/false
  willing_to_relocate: null      # true/false
  # Years of experience you can credibly claim, and what happens to a posting
  # that asks for more:
  #   reject  drop it (the default)
  #   rank    keep it, ranked lower, with the reason shown
  #   off     ignore years entirely
  # Many postings ask for more than they hold out for. `rank` lets you try.
  # Run `jsa rescore`, then `jsa discover`, after changing it: postings already
  # dropped were never stored, so only a new discovery run brings them back.
  max_years_experience: 3
  years_filter: reject

  # Named commute regions for `matches --near <name>`. Each is a list of
  # substrings matched against a listing's location text. Define whatever
  # makes sense for where you'd actually work.
  regions:
    # Named groups of places, for `matches --near <name>`. Name them whatever
    # makes sense to you -- "home", "second", "anywhere_i_would_move" -- and
    # list the towns each one covers. A compensation floor can be set per
    # region using these same names.
    home:
      - "Your City"
      - "A Nearby City"
      - "A Suburb You Would Commute To"
    second:
      - "A City You Would Relocate To"
      - "A Town Near It"

  exclude_keywords:              # hard filters applied during discovery
    - "Senior"
    - "Staff"
    - "Principal"
    - "Tech Lead"
    - "Team Lead"
    - "Engineering Manager"
    - "Product Manager"
    - "Program Manager"
    - "10+ years"
    - "8+ years"
    - "PhD required"
    - "Security clearance"
    - "Clearance"          # SpaceX/Anduril post many; a clearance is a hard blocker
    - "Top Secret"
    - "Polygraph"

# ---------------------------------------------------------------------------
# Summary variants. The tailoring module picks the closest `family` match and
# then lightly rewords it against the JD — it does not write one from scratch.
# ---------------------------------------------------------------------------
summaries:
  - id: sum_general
    family: general
    text: >-
      Career-changer with hands-on experience building real automation in Python,
      not just coursework. Comfortable across the whole cycle: reading an API's
      docs, wiring services together, and testing the result. Brings an uncommon
      combination of technical work and customer-facing work, and a record of
      learning complicated systems quickly because the job required it.
  - id: sum_ai_eng
    family: ai_engineering
    text: >-
      Self-directed developer building language-model tooling in Python: prompt
      design, multi-API orchestration, and an evaluation set to check the output
      against. Currently building two applied projects, a support-ticket triage
      assistant and a transit reliability report.
  - id: sum_customer_facing
    family: customer_facing_technical
    text: >-
      Technical practitioner with a sales background: three years installing and
      then selling commercial HVAC and building-control systems, now building
      language-model automation in Python. Combines hands-on system knowledge
      with the customer-facing skills to explain it — a fit for solutions,
      forward-deployed, and technical account roles.

# ---------------------------------------------------------------------------
# Work experience. `bullets` are the reusable units.
#   strength: how load-bearing the bullet is (1 = always include, 3 = filler)
#   tags:     matched against JD keywords by the tailoring module
#
# NOTE the shape here, because two things depend on it:
#   - Two roles at ONE employer. Being promoted without changing employer is
#     common, and it used to collapse both roles into one heading (ADR 0011).
#     Keep the `id:` on each entry.
#   - `family` decides which bullets a track prefers: engineering favours
#     ai_engineering and data_ml, sales favours sales and technical_field.
# ---------------------------------------------------------------------------
experience:
  - id: exp_riverton_sales
    company: Riverton Mechanical
    company_descriptor: Commercial HVAC & Building Controls
    title: Account Representative
    location: null              # TODO — needed for a complete resume header
    start: 2022-03
    end: 2023-10
    current: false
    family: sales
    # Optional. The bullet to show when this job appears only so the resume
    # has work history (e.g. a sales job on an engineering resume). Without it
    # the best keyword match is used. Must be one of this entry's bullets.
    work_history_bullet: b_riv_promo
    bullets:
      - id: b_riv_promo
        strength: 1
        text: >-
          Promoted from service technician to account representative on the
          strength of field experience and customer-facing work.
        tags: [promotion, growth, customer-facing, technical-credibility]
      - id: b_riv_sell
        strength: 1
        text: >-
          Sold rooftop unit replacements and building-control retrofits to property
          managers, using firsthand installation experience to size the job and
          answer technical objections.
        tags: [sales, technical-sales, b2b, account-management, customer-facing]
      - id: b_riv_cycle
        strength: 2
        text: >-
          Managed the full sales cycle from site walk-through and estimate through
          proposal, negotiation, and close.
        tags: [sales-cycle, prospecting, negotiation, account-management, ownership]

  - id: exp_riverton_tech
    company: Riverton Mechanical
    company_descriptor: Commercial HVAC & Building Controls
    title: Service Technician
    location: null              # TODO
    start: 2020-06
    end: 2022-03
    current: false
    family: technical_field
    bullets:
      - id: b_riv_install
        strength: 1
        text: >-
          Installed and commissioned rooftop units, thermostats, and building-control
          panels across commercial sites.
        tags: [systems, hardware, commissioning, troubleshooting, hands-on]
      - id: b_riv_codes
        strength: 2
        text: >-
          Ensured every installation met mechanical code and manufacturer
          specification, and documented the work for inspection.
        tags: [compliance, standards, quality, attention-to-detail, documentation]

# ---------------------------------------------------------------------------
# Applied projects — the strongest evidence for technical roles.
# `status: in_development` must be shown honestly on every tailored resume, and
# the verifier will refuse a draft that turns "Building" into "Built".
# ---------------------------------------------------------------------------
projects:
  - id: proj_ticket_triage
    name: Support Ticket Triage Assistant
    status: in_development
    repo: null                  # TODO — link the repo once it is public
    demo: null                  # TODO
    stack: [Python, SQLite, LLM APIs]
    family: ai_engineering
    bullets:
      - id: b_tix_design
        strength: 1
        text: >-
          Designing a Python service that reads an incoming support ticket with a
          language model and drafts a suggested first reply for a person to approve.
        tags: [python, llm, pipeline, automation, api-integration, customer-facing]
      - id: b_tix_eval
        strength: 1
        text: >-
          Building an evaluation set from past tickets, and measuring suggestion
          quality against it before changing a prompt.
        tags: [evaluation, accuracy, prompt-engineering, testing, iteration]
      - id: b_tix_goal
        strength: 2
        text: >-
          Goal: cut the time to a first response while a person still approves
          every reply that goes out.
        tags: [automation, workflow, iteration]

  - id: proj_transit_report
    name: Transit Reliability Report
    status: in_development
    repo: null                  # TODO
    demo: null
    stack: [Python, pandas, public transit APIs]
    family: data_ml
    bullets:
      - id: b_transit_build
        strength: 1
        text: >-
          Building a Python tool that reads a city's public transit feed and reports
          which routes run late most often.
        tags: [python, data-analysis, real-time, api-integration, reporting]
      - id: b_transit_apis
        strength: 1
