# ---------------------------------------------------------------------------
# ATS keyword bank. The tailoring module scores a JD against `have` and reports
# `missing` so the candidate knows the real gap instead of keyword-stuffing.
# ---------------------------------------------------------------------------
ats_keywords:
  have:
    - Python
    - Large Language Models
    - LLM
    - Generative AI
    - Prompt Engineering
    - Claude
    - Gemini
    - API Integration
    - Automation
    - Cloud-Native
    - Agentic Workflows
    - Model Context Protocol
    - Data Analysis
    - Rapid Prototyping
    - Technical Sales
    - Customer-Facing
  # Never insert these into a resume unless the underlying skill becomes true.
  aspirational_do_not_claim:
    - Kubernetes
    - Distributed Systems
    - Production ML
    - PyTorch
    - TensorFlow
    - Java
    - C++
    - React

# ---------------------------------------------------------------------------
# Honest positioning notes. Used by the tailoring and interview-prep modules;
# never printed on a resume.
# ---------------------------------------------------------------------------
gaps_and_notes:
  - id: gap_no_swe_employment
    note: >-
      No paid software engineering employment yet. Both technical projects are
      self-directed and in development. Discovery should target entry/junior/
      associate roles, apprenticeships, and AI-adjacent customer-facing roles
      (solutions engineer, forward-deployed engineer, technical support engineer)
      where the sales background is an asset rather than a detour.
  - id: gap_employment_break
    note: >-
      Gap from November 2023 to present. Frame as a deliberate pivot into AI:
      certifications completed 2026 plus two applied projects. Have a one-sentence
      answer ready — the interview-prep module should drill this.
  - id: gap_no_shipped_repo
    note: >-
      Nothing public on GitHub yet is the single biggest fixable weakness. One
      finished, documented repo would outweigh another certificate.
  - id: strength_sales
    note: >-
      Three years of real revenue-facing work is genuinely differentiating against
      other career-changers. Lead with it for any role that touches a customer.
