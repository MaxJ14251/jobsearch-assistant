    board: ziprecruiter
    hq: Santa Monica, CA
    priority: 1
    verified: true          # 44 listings, 14 of them Santa Monica

  - company: Snap
    slug: snap
    kind: custom
    handler: snap
    careers_url: https://careers.snap.com/jobs
    hq: Santa Monica, CA
