# The drafting evals' profile (plan 25). Fictional: an invented person, invented
# employers, invented projects. It is richer than the example on purpose, so
# selection has real choices to make: customer-facing work, field work, AI and
# data projects (one released with a public repo, one still being built), and
# a job outside tech. Never copy a real profile's content into this file;
# tests/test_evals.py checks it shares nothing with a personal profile.

