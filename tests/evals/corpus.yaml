# Filler postings for the evals' tag weights (plan 25). tag_weights needs at
# least 20 documents, or every tag counts equally. These are short, fictional,
# and deliberately ordinary: many say "systems", "team" and "customers", few
# say "commissioning" or "prompt engineering", as real postings do. "systems"
# is in 92% of them and "hardware" in 54%, near the tracker's measured 87% and
# 47% (ADR 0005). Fixed and committed, so the weights are the same every run.
