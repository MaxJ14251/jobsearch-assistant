name: tests

on:
  push:
    # ci/** so a branch can be proven before anything is merged.
    branches: [main, master, "ci/**"]
  pull_request:

# Runners are pinned (2026-09-29, n24). ubuntu-latest moves to Ubuntu 26.04
# from 2026-10-19, and a moving label means a green build can turn red with
# no commit behind it. Move the pin after a run on ubuntu-26.04 has passed
# (the trial ran on the ci/ubuntu-26 branch; see the commit that moves it).
# Actions are at their current majors, which run on Node 24.
jobs:
  test:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install coverage

      # The suite must run with no API key and no tracker database — exactly
      # what a fresh clone has. Anything that needs either must skip, not fail.
      - name: Set up a new user's world
        run: |
          cp .env.example .env
          cp profile/master_profile.example.yaml profile/master_profile.yaml
          python -m jsa init

      - name: Run tests
        run: coverage run -m unittest discover -s tests -t .

      - name: Coverage
        run: |
          coverage report --omit="tests/*,tools/*" --skip-covered
          coverage xml

  no-secrets:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install PyYAML
      # Fails the build if an API key or personal data reached a tracked file.
      - name: Scan for secrets and personal data
        run: python tools/scan_secrets.py

  no-secrets-in-history:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          # Without this, checkout fetches one commit and the history scan
          # would pass by only ever looking at HEAD -- a green check that
          # proves nothing. Publishing publishes all of them.
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install PyYAML
      # Every blob, commit message and ref, not just the working tree. Known
      # findings live in tools/history_allowlist.txt; a new one fails here.
      - name: Scan every commit for secrets and personal data
        run: python tools/scan_history.py

  # The development machine cannot run Docker, so the container's claims are
  # proven here: no personal files in any layer, not root, init and matches
  # with no API key, the public-bind guard both ways, and a tracker that
  # survives a restart. Builds only; nothing is pushed to a registry.
  docker:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Build the image and prove what the README says about it
        run: bash tools/docker_check.sh
