name: tests

on:
  push:
    # ci/** so a branch can be proven before anything is merged.
    branches: [main, master, "ci/**"]
  pull_request:

# Runners are pinned (2026-09-29, n24): a moving label like ubuntu-latest
# means a green build can turn red with no commit behind it. Moved from
# 24.04 to 26.04 on 2026-09-30, ahead of ubuntu-latest moving on 2026-10-19,
# after every job passed on 26.04 on the ci/ubuntu-26 branch (run
# 36798983933). Move it the same way: trial on a ci/** branch first.
# Actions are at their current majors, which run on Node 24.
jobs:
  test:
    runs-on: ubuntu-26.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install coverage

      # The suite must run with no API key and no tracker database — exactly
      # what a fresh clone has. Anything that needs either must skip, not fail.
      - name: Set up a new user's world
        run: |
          python -m jsa init

      # Two warnings are failures here (Plan 4, 2026-10-02). Python 3.13 warns
      # about a SQLite connection garbage-collected while open; this job turns
      # that on and fails if any appear. A grep after the run, not -W error:
      # the warning fires in __del__, where -W error prints and does not fail.
      # And Starlette's test client warns when it falls back from httpx2 to
      # httpx, which a later Starlette will stop supporting.
      - name: Run tests
        shell: bash
        run: |
          set -o pipefail
          if [ "${{ matrix.python-version }}" = "3.13" ]; then
            export PYTHONWARNINGS=always::ResourceWarning PYTHONTRACEMALLOC=10
          fi
          coverage run -m unittest discover -s tests -t . 2>&1 | tee test-output.txt
          if grep -q "ResourceWarning: unclosed" test-output.txt; then
            echo "::error::A connection or file was left open (see 'Object allocated at' above)."
            exit 1
          fi
          if grep -q "StarletteDeprecationWarning" test-output.txt; then
            echo "::error::Starlette's test client fell back to httpx; is httpx2 installed?"
            exit 1
          fi

      - name: Coverage
        run: |
          coverage report --omit="tests/*,tools/*" --skip-covered
          coverage xml

  no-secrets:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install PyYAML
      # Fails the build if an API key or personal data reached a tracked file.
      - name: Scan for secrets and personal data
        run: python tools/scan_secrets.py

  no-secrets-in-history:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
        with:
          # Without this, checkout fetches one commit and the history scan
          # would pass by only ever looking at HEAD -- a green check that
          # proves nothing. Publishing publishes all of them.
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install PyYAML
      # Every blob, commit message and ref, not just the working tree. Known
      # findings live in tools/history_allowlist.txt; a new one fails here.
      - name: Scan every commit for secrets and personal data
        run: python tools/scan_history.py

  # The development machine cannot run Docker, so the container's claims are
  # proven here: no personal files in any layer, not root, init and matches
  # with no API key, the public-bind guard both ways, and a tracker that
  # survives a restart. Builds only; nothing is pushed to a registry.
  docker:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - name: Build the image and prove what the README says about it
        run: bash tools/docker_check.sh
