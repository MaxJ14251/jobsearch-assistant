# Employers for a Canadian profile (country: CA; ADR 0037).
#
# The US list (companies.yaml) is the US pack's starter list; this is the
# Canada pack's. A clone working in Canada reads and `jsa verify --write`s
# this file; an installed copy is seeded from it.
#
# How these 22 were chosen (2026-10-30): about 50 Canadian-headquartered
# employers were tried on Greenhouse, Lever and Ashby; these 22 answered
# with postings located in Canada (448 of them that day). Each board was
# then confirmed to be that employer's own -- a guessed token can be
# someone else's board: Greenhouse's board name matched the company, and
# for Lever and Ashby every posting names the company or its product.
# The count after each is the listings that day.
#
# No nationwide source is listed: Job Bank's terms refuse automated access,
# and The Muse placed 0 to 23 of 100 postings in Canadian cities (ADR 0037).
#
# Fields by kind:
#   greenhouse/lever/ashby   board

sources:

  - company: Lightspeed
    slug: lightspeed
    kind: ashby
    board: lightspeedhq
    hq: Montréal, QC
    priority: 2
    verified: true          # 120 listings

