<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Connect the extension · Job Search</title>
<style>
  /* The dashboard's look (jsa/web/templates/base.html): its tokens, sky, frosted
     card and buttons. The theme follows the computer's setting. */
  :root { color-scheme: light dark;
    --ink: #0E2233; --ink-2: #2B4256; --mute: #4A6072; --rule: #CFE0EA; --paper: #E6F4FC;
    --copper: #0B7A65; --btn: #0B7A65; --btn-top: #34B597; --btn-bottom: #08705C;
    --glass: rgba(255,255,255,.86); --glass-edge: rgba(255,255,255,.95);
    --glass-shadow: 0 10px 30px rgba(20,100,160,.13), inset 0 1px 0 rgba(255,255,255,.95);
    --sky: radial-gradient(ellipse 55% 40% at 82% -6%, rgba(255,255,255,.9), transparent 70%),
      radial-gradient(ellipse 80% 38% at 18% 106%, rgba(120,200,80,.42), transparent 70%),
      radial-gradient(ellipse 65% 32% at 88% 108%, rgba(50,175,110,.32), transparent 70%),
      linear-gradient(180deg, #B3E2F8 0%, #CDEBFA 30%, #EAF6FC 62%, #F1FAEF 100%); }
  @media (prefers-color-scheme: dark) {
    :root {
      --ink: #E4F3FA; --ink-2: #BDD6E3; --mute: #8FAABB; --rule: #1E3A50; --paper: #050F1A;
      --copper: #4FD1B5; --btn: #0F7A65; --btn-top: #2BB79A; --btn-bottom: #0A6553;
      --glass: rgba(12,32,50,.86); --glass-edge: rgba(120,210,255,.16);
      --glass-shadow: 0 12px 34px rgba(0,0,0,.5), inset 0 1px 0 rgba(150,225,255,.12);
      --sky: radial-gradient(ellipse 60% 45% at 85% -4%, rgba(30,160,220,.30), transparent 70%),
        radial-gradient(ellipse 55% 40% at 10% 104%, rgba(80,200,110,.20), transparent 70%),
        radial-gradient(ellipse 50% 40% at 45% 50%, rgba(70,80,190,.10), transparent 70%),
        linear-gradient(170deg, #06182A 0%, #05131F 55%, #030B14 100%); }
  }
  * { box-sizing: border-box; }
  body { margin: 0; padding: 40px 16px; color: var(--ink); background: var(--paper);
         font: 15px/1.55 -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", sans-serif; }
  body::before { content: ""; position: fixed; inset: 0; z-index: -1; background: var(--paper);
                 background-image: var(--sky); pointer-events: none; }
  main { max-width: 480px; margin: 0 auto; }
  .brand { font-size: 17px; font-weight: 700; letter-spacing: -.01em; margin: 0 0 12px 4px; }
  .card { padding: 22px; background: var(--glass); border: 1px solid var(--glass-edge);
          border-radius: 22px; box-shadow: var(--glass-shadow);
          backdrop-filter: blur(18px); -webkit-backdrop-filter: blur(18px); }
  h1 { font-size: 22px; font-weight: 600; letter-spacing: -.01em; margin: 0 0 4px; }
  p { margin: 0; color: var(--mute); font-size: 14px; }
  label { display: block; margin: 16px 0 4px; font-size: 13.5px; font-weight: 600; color: var(--ink-2); }
  input { width: 100%; min-height: 38px; padding: 7px 10px; font: inherit; font-size: 14px;
          color: inherit; background: transparent; border: 1px solid var(--rule); border-radius: 10px; }
  .row { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 18px; }
  button { font: inherit; font-size: 14px; font-weight: 600; min-height: 36px; padding: 8px 16px;
           border: 0; border-radius: 12px; color: #fff; cursor: pointer; background: var(--btn);
           background-image: linear-gradient(180deg, var(--btn-top) 0%, var(--btn) 35%, var(--btn-bottom) 100%);
           box-shadow: inset 0 1px 0 rgba(255,255,255,.5),
                       0 3px 10px color-mix(in srgb, var(--btn) 30%, transparent); }
  button.quiet { color: var(--ink-2); background: transparent; background-image: none;
                 border: 1px solid var(--rule); box-shadow: none; }
  :focus-visible { outline: 2px solid var(--copper); outline-offset: 2px; }
  #status { margin-top: 12px; min-height: 1.5em; color: var(--ink); }
</style>
</head>
<body>
<main>
<div class="brand">Job Search</div>
<div class="card">
  <h1>Connect the extension</h1>
  <p>It reads your dashboard on this computer and fills Greenhouse, Lever and Ashby forms. It never presses Submit.</p>
  <label for="key">Pairing key</label>
  <input id="key" type="password" autocomplete="off" placeholder="From the dashboard's Extension page">
  <label for="port">Dashboard port</label>
  <input id="port" type="number" min="1" max="65535" value="8765">
  <div class="row">
    <button id="save" type="button">Save</button>
    <button id="test" type="button" class="quiet">Test the connection</button>
  </div>
  <p id="status" role="status"></p>
</div>
</main>
<script src="options.js"></script>
</body>
</html>
