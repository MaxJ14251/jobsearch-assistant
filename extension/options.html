<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Job Search Assistant: options</title>
<style>
  :root { --ink: #1f2420; --muted: #5d655f; --line: #d7dcd6; --bg: #f7f8f6; --accent: #2f6f5e; }
  @media (prefers-color-scheme: dark) {
    :root { --ink: #e7ebe6; --muted: #a3aba4; --line: #3a413c; --bg: #161a17; --accent: #7cc2ad; }
  }
  body { font: 15px/1.5 system-ui, sans-serif; color: var(--ink); background: var(--bg);
         max-width: 560px; margin: 32px auto; padding: 0 16px; }
  h1 { font-size: 20px; margin: 0 0 4px; }
  p { color: var(--muted); }
  label { display: block; margin: 18px 0 6px; font-weight: 600; }
  input { width: 100%; box-sizing: border-box; padding: 8px; font: inherit;
          border: 1px solid var(--line); border-radius: 4px; background: transparent; color: inherit; }
  .row { display: flex; gap: 10px; margin-top: 18px; }
  button { font: inherit; padding: 8px 14px; border-radius: 4px; border: 1px solid var(--accent);
           background: var(--accent); color: var(--bg); cursor: pointer; }
  button.quiet { background: transparent; color: var(--accent); }
  button:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  #status { margin-top: 14px; color: var(--ink); min-height: 1.5em; }
</style>
</head>
<body>
<h1>Fill, you submit</h1>
<p>This extension reads from your own dashboard on this computer and fills Greenhouse, Lever and Ashby application forms. It never presses Submit.</p>
<label for="port">Dashboard port</label>
<input id="port" type="number" min="1" max="65535" value="8765">
<label for="key">Pairing key</label>
<input id="key" type="password" autocomplete="off" placeholder="From the dashboard's Extension page">
<div class="row">
  <button id="save" type="button">Save</button>
  <button id="test" type="button" class="quiet">Test the connection</button>
</div>
<div id="status" role="status"></div>
<script src="options.js"></script>
</body>
</html>
