<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fixture: Greenhouse's current upload fields</title>
<style>
  body { font: 15px/1.5 system-ui, sans-serif; max-width: 640px; margin: 24px auto; padding: 0 16px;
         background: #fff; color: #222; }
  .visually-hidden { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
  .file-upload, .field { margin: 14px 0; }
  .label { font-weight: 600; }
  input[type=email] { width: 100%; padding: 6px; box-sizing: border-box; }
</style>
</head>
<body>
<!-- Field markup in the shape of job-boards.greenhouse.io, read 2026-10-30: each file
     input is labelled "Attach" and the question is on the group around it.
     Fictional; not a copied page. -->
<h1>Support Engineer</h1>
<form action="#" onsubmit="document.body.dataset.submitted = 'yes'; return false;">
  <div class="field"><label for="email">Email*</label><input type="email" id="email" required></div>
  <div role="group" aria-labelledby="upload-label-resume" aria-required="true" class="file-upload">
    <div id="upload-label-resume" class="label upload-label">Resume/CV*</div>
    <div><button type="button">Attach</button><label class="visually-hidden" for="resume">Attach</label>
      <input id="resume" class="visually-hidden" type="file"></div>
  </div>
  <div role="group" aria-labelledby="upload-label-question_1" aria-required="false" class="file-upload">
    <div id="upload-label-question_1" class="label upload-label">Portfolio or Cover Letter</div>
    <div><button type="button">Attach</button><label class="visually-hidden" for="question_1">Attach</label>
      <input id="question_1" class="visually-hidden" type="file"></div>
  </div>
  <div role="group" aria-labelledby="upload-label-question_2" aria-required="true" class="file-upload">
    <div id="upload-label-question_2" class="label upload-label">Writing sample*</div>
    <div><button type="button">Attach</button><label class="visually-hidden" for="question_2">Attach</label>
      <input id="question_2" class="visually-hidden" type="file"></div>
  </div>
  <p><button type="submit" id="submit_app">Submit Application</button></p>
</form>
<script>window.__jsaTestBoard = "greenhouse"; window.__jsaTestPage = "greenhouse:4012345";</script>
<script src="harness.js"></script>
<script src="../../fill.js"></script>
<script src="../../session.js"></script>
<script src="../../research.js"></script>
<script src="../../content.js"></script>
</body>
</html>
